name: EterLib CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EterLib
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build liblzo2-dev libzip-dev libjpeg-dev libgl1-mesa-dev libglu1-mesa-dev libegl-dev libgl1-mesa-dri libsdl2-dev libfreetype-dev zlib1g-dev

      - name: Checkout Sibling Dependencies
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/open-mt2/pkg_eterbase.git deps/EterBase
          git clone --depth 1 https://github.com/open-mt2/pkg_eterlocale.git deps/EterLocale
          git clone --depth 1 https://github.com/open-mt2/pkg_eterpack.git deps/EterPack
          git clone --depth 1 https://github.com/open-mt2/pkg_eterimagelib.git deps/EterImageLib
          git clone --depth 1 https://github.com/open-mt2/pkg_spherelib.git deps/SphereLib

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Unit Tests
        working-directory: build
        run: ctest -C Release --output-on-failure
